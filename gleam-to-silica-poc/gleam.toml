name = "gleam_to_silica_poc"
version = "0.1.0"
description = "Proof of concept: a Gleam inbound codex and TCP sender for the to-silica transport contract, version 1"
licences = ["Apache-2.0"]
target = "erlang"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
glance = ">= 7.0.0 and < 8.0.0"
glexer = ">= 2.5.0 and < 3.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
argv = ">= 1.1.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
